<div class="card" *ngIf="pokemon">
  <h2>#{{ pokemon.id }} - {{ pokemon.name | titlecase }}</h2>
  <img 
    [src]="pokemon.sprites.other?.['official-artwork']?.front_default || pokemon.sprites.front_default" 
    [alt]="pokemon.name" 
  />
  <div class="types">
    <span *ngFor="let t of pokemon.types" class="badge">{{ t.type.name | uppercase }}</span>
  </div>
  <div class="info">
    <p><strong>Altura:</strong> {{ pokemon.height / 10 }} m</p>
    <p><strong>Peso:</strong> {{ pokemon.weight / 10 }} kg</p>
  </div>
  <h3>Estadísticas Base</h3>
  <ul>
    <li *ngFor="let s of pokemon.stats">
      <strong>{{ s.stat.name | uppercase }}:</strong> {{ s.base_stat }}
    </li>
  </ul>
</div>
